    <link
      rel="preload"
      as="font"
      href="https://fonts.gstatic.com/s/anton/v27/1Ptgg87LROyAm3Kz-C8.woff2"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" as="image" href="/assets/preloader.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #111;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 0.22s ease,
          visibility 0.22s ease;
      }
      #preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #preloader .loader-inner {
        display: grid;
        justify-items: center;
        gap: 26px;
      }
      #preloader img {
        width: 190px;
        height: auto;
        animation: loader-bounce 0.72s ease-in-out infinite alternate;
      }
      #preloader .loader-track {
        width: 170px;
        height: 5px;
        overflow: hidden;
        background: #393939;
      }
      #preloader .loader-progress {
        width: 40%;
        height: 100%;
        background: #e63946;
        animation: loader-progress 1.15s ease-in-out forwards;
      }
      @keyframes loader-bounce {
        to {
          transform: translateY(-9px) scale(1.025);
        }
      }
      @keyframes loader-progress {
        to {
          width: 94%;
          background: #ffc300;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader img {
          animation: none;
          transition: opacity 0.2s ease;
        }
        #preloader .loader-progress {
          animation: none;
          width: 75%;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="loader-inner">
        <img src="/assets/preloader.png" width="190" height="52" alt="" />
        <div class="loader-track"><div class="loader-progress"></div></div>
      </div>
    </div>
    <app-root></app-root>
    <script>
      (() => {
        const preloader = document.getElementById('preloader');
        if (!preloader) return;
        const startedAt = Date.now();
        let dismissed = false;
        const dismiss = () => {
          if (dismissed) return;
          dismissed = true;
          window.setTimeout(
            () => preloader.classList.add('is-hidden'),
            Math.max(0, 1200 - (Date.now() - startedAt)),
          );
        };
        window.addEventListener('load', dismiss, { once: true });
        window.setTimeout(dismiss, 6000);
      })();
    </script>
  </body>
</html>
